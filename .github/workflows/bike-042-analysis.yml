name: Bike 0.42 analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[eda]'
          pip install ucimlrepo
      - name: Run analysis
        run: python analysis/bike_042_results.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bike-042-results
          path: analysis_output/
          if-no-files-found: warn
